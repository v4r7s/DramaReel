workflows:
  ios-build-ipa:
    name: Dramareel iOS - Build IPA Package (No Apple Account Required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: "Dramareel.xcodeproj"
        XCODE_SCHEME: "Dramareel"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install Tools & Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies -project Dramareel.xcodeproj
      - name: Build and Archive Dramareel Application
        script: |
          xcodebuild archive \
            -project Dramareel.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -archivePath build/ios/xcarchive/Dramareel.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=targeted
      - name: Package IPA Artifact
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/xcarchive/Dramareel.xcarchive/Products/Applications/Dramareel.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Dramareel.ipa Payload
          echo "=========================================================="
          echo "SUCCESS: Dramareel.ipa has been packaged successfully!"
          echo "You can download it directly from Codemagic build Artifacts."
          echo "=========================================================="
    artifacts:
      - build/ios/ipa/*.ipa

  ios-build-test:
    name: Dramareel iOS - Build & Unit Tests
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: "Dramareel.xcodeproj"
        XCODE_SCHEME: "Dramareel"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Install Tools
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies -project Dramareel.xcodeproj
      - name: Run Unit Tests
        script: |
          xcodebuild test \
            -project Dramareel.xcodeproj \
            -scheme Dramareel \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  ios-release-testflight:
    name: Dramareel iOS - Release to TestFlight (Requires Apple Developer Account)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      groups:
        - app_store_credentials # Set APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
        - apple_signing_certs  # Set CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_PROJECT: "Dramareel.xcodeproj"
        XCODE_SCHEME: "Dramareel"
        BUNDLE_ID: "com.dramareel.app"
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install Tools and Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Check Apple Developer Credentials
        script: |
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] || [ "$APP_STORE_CONNECT_PRIVATE_KEY" = "null" ]; then
            echo "ERROR: You need an Apple Developer Program account to use TestFlight."
            echo "Please use the 'ios-build-ipa' workflow instead to generate the IPA without an Apple account."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project Dramareel.xcodeproj
      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies -project Dramareel.xcodeproj
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project Dramareel.xcodeproj \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - devops@dramareel.app
        notify:
          failure: true
          success: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
